version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: lan-clipboard

build:
  run_buildscript: false

images:
  - id: lan-clipboard
    target: service
    service: lan-clipboard
    source: docker.1ms.run/kasusa/lan-clipboard-app
    channel: custom
    sort: semver
    tag_regex: '^\d{8}$'
    version_regex: '^(?P<version>\d{8})$'
    version_template: '{version}.0.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: LAN Clipboard
    summary: 由 GitHub Actions 自动发布
