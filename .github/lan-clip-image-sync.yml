version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: lan-clip
    bump: patch

build:
  run_buildscript: false

images:
  - id: lan-clip
    target: service
    service: lan-clipboard
    source: docker.io/kasusa/lan-clip
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: false
