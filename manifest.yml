min_os_version: 1.3.8
name: LAN Clipboard
package: community.lazycat.app.lan-clipboard
version: 1.2.1
description: "网络剪贴板，轻松粘贴任何文本、文件、图片以保存。用于临时使用。"
homepage: https://github.com/cornradio/Lan-clip
author: cornradio
application:
  subdomain: lan-clipboard
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://lan-clipboard:5000/

services:
  lan-clipboard:
    # kasusa/lan-clipboard-app:20251103
    image: registry.lazycat.cloud/czyt/kasusa/lan-clipboard-app:7141c53806b5fb46
    container_name: lan-clipboard
locales:
  zh:
    name: "LAN Clipboard"
    description: "网络剪贴板，轻松粘贴任何文本、文件、图片以保存。用于临时使用。"
  en:
    name: "LAN Clipboard"
    description: "web clipboard , easy paste any text 、file、 images to save . for temporary use.  "
